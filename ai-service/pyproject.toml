[tool.black]
line-length    = 100
target-version = ["py311"]
exclude        = '''
/(
    \.venv
  | __pycache__
  | \.git
  | data
  | models
)/
'''

[tool.ruff]
line-length    = 100
target-version = "py311"
select = [
  "E",   # pycodestyle errors
  "W",   # pycodestyle warnings
  "F",   # pyflakes
  "I",   # isort
  "B",   # flake8-bugbear
  "C4",  # flake8-comprehensions
  "UP",  # pyupgrade
]
ignore = [
  "E501",  # line too long (black handles this)
  "B008",  # function calls in default args (FastAPI uses this pattern)
  "B904",  # raise...from err (too strict for this codebase)
]
exclude = [".venv", "__pycache__", "data", "models"]

[tool.ruff.isort]
known-first-party = ["models", "routers", "schemas", "utils", "config"]

[tool.pytest.ini_options]
testpaths    = ["tests"]
asyncio_mode = "auto"
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "--tb=short -q"
