# nginx/nginx.conf
#
# Production Nginx configuration for AttendanceAI
#
# Topology:
#   Internet → Nginx (port 443/80) → upstream services:
#     /api/*        → Node.js backend  (port 3000)
#     /socket.io/*  → WebSocket server (port 3000)
#     /ai/*         → FastAPI AI       (port 8000)
#     /*            → React SPA (static files from /var/www/html)
#
# Security hardening:
#   • TLSv1.2 + TLSv1.3 only (no TLS 1.0/1.1)
#   • HSTS with 1-year max-age + preload
#   • CSP, X-Frame-Options, Referrer-Policy headers
#   • Rate limiting zones: api (60/min), auth (10/min), ai (30/min)
#   • Request body size limit (10MB for face image uploads)
#   • Hide Nginx version

user  nginx;
worker_processes  auto;
worker_rlimit_nofile 65535;
error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  4096;
    use epoll;
    multi_accept on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # ── Logging ────────────────────────────────────────────────────────────────
    log_format main '$remote_addr - $remote_user [$time_local] '
                    '"$request" $status $body_bytes_sent '
                    '"$http_referer" "$http_user_agent" '
                    'rt=$request_time uct=$upstream_connect_time '
                    'uht=$upstream_header_time urt=$upstream_response_time';

    access_log  /var/log/nginx/access.log  main buffer=16k;

    # ── Performance ───────────────────────────────────────────────────────────
    sendfile            on;
    tcp_nopush          on;
    tcp_nodelay         on;
    keepalive_timeout   65;
    server_tokens       off;   # hide Nginx version
    client_max_body_size 10m;  # allow face image uploads (base64 ~3.3× raw)

    # ── Gzip ──────────────────────────────────────────────────────────────────
    gzip              on;
    gzip_vary         on;
    gzip_proxied      any;
    gzip_comp_level   6;
    gzip_types        text/plain text/css text/xml application/json
                      application/javascript application/rss+xml
                      application/atom+xml image/svg+xml;

    # ── Rate limiting zones ────────────────────────────────────────────────────
    # Zones are shared across all worker processes via shared memory
    limit_req_zone $binary_remote_addr zone=api:10m  rate=60r/m;
    limit_req_zone $binary_remote_addr zone=auth:10m rate=10r/m;
    limit_req_zone $binary_remote_addr zone=ai:10m   rate=30r/m;
    limit_req_status 429;

    # ── Upstream definitions ──────────────────────────────────────────────────
    upstream backend {
        least_conn;                            # route to least-busy instance
        server backend:3000 max_fails=3 fail_timeout=30s;
        keepalive 32;                          # reuse connections to upstream
    }

    upstream ai_service {
        server ai-service:8000 max_fails=2 fail_timeout=20s;
        keepalive 16;
    }

    # ── SSL configuration ─────────────────────────────────────────────────────
    ssl_certificate      /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key  /etc/nginx/certs/privkey.pem;
    ssl_session_cache    shared:SSL:10m;
    ssl_session_timeout  1d;
    ssl_session_tickets  off;
    ssl_protocols        TLSv1.2 TLSv1.3;
    ssl_ciphers          ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:
                         ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:
                         ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_stapling         on;
    ssl_stapling_verify  on;
    resolver             1.1.1.1 8.8.8.8 valid=300s;
    resolver_timeout     5s;

    # ── HTTP → HTTPS redirect ─────────────────────────────────────────────────
    server {
        listen      80;
        listen      [::]:80;
        server_name attendance.university.edu api.attendance.university.edu;
        return      301 https://$host$request_uri;
    }

    # ── API server ────────────────────────────────────────────────────────────
    server {
        listen       443 ssl http2;
        listen       [::]:443 ssl http2;
        server_name  api.attendance.university.edu;

        # ── Security headers ─────────────────────────────────────────────────
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
        add_header X-Frame-Options           "DENY"                always;
        add_header X-Content-Type-Options    "nosniff"             always;
        add_header Referrer-Policy           "strict-origin"       always;
        add_header X-Request-ID              $request_id           always;
        # CSP: API only serves JSON — no HTML, so CSP is tight
        add_header Content-Security-Policy   "default-src 'none'" always;

        # ── WebSocket upgrade map ────────────────────────────────────────────
        map $http_upgrade $connection_upgrade {
            default upgrade;
            ''      close;
        }

        # ── /api/* → Node.js backend ──────────────────────────────────────────
        location /api/ {
            limit_req zone=api burst=20 nodelay;

            proxy_pass         http://backend;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_set_header   X-Request-ID      $request_id;

            proxy_connect_timeout 10s;
            proxy_send_timeout    60s;
            proxy_read_timeout    60s;

            # Buffer tuning for large responses (analytics exports)
            proxy_buffering       on;
            proxy_buffer_size     16k;
            proxy_buffers         8 16k;
        }

        # ── Stricter rate limit on auth endpoints ─────────────────────────────
        location /api/auth/ {
            limit_req zone=auth burst=5 nodelay;

            proxy_pass         http://backend;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
        }

        # ── /socket.io/* → WebSocket ──────────────────────────────────────────
        location /socket.io/ {
            proxy_pass         http://backend;
            proxy_http_version 1.1;
            proxy_set_header   Upgrade           $http_upgrade;
            proxy_set_header   Connection        $connection_upgrade;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_read_timeout 3600s;   # keep WS connections open for long sessions
            proxy_send_timeout 3600s;
        }

        # ── /ai/* → Python AI microservice ────────────────────────────────────
        location /ai/ {
            limit_req zone=ai burst=10 nodelay;

            # Strip /ai prefix before forwarding
            rewrite ^/ai/(.*) /$1 break;
            proxy_pass         http://ai_service;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_read_timeout 30s;    # face recognition can take up to 3s
            client_max_body_size 10m;  # face image uploads

            # AI service is internal-only: block external access
            # (In production: keep ai-service off public subnet entirely)
        }

        # ── Health check (bypasses rate limiting) ─────────────────────────────
        location /health {
            proxy_pass       http://backend;
            access_log       off;
            proxy_set_header Host $host;
        }
    }

    # ── Frontend SPA server ───────────────────────────────────────────────────
    server {
        listen      443 ssl http2;
        listen      [::]:443 ssl http2;
        server_name attendance.university.edu;

        root        /var/www/html;
        index       index.html;

        # ── Security headers ─────────────────────────────────────────────────
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
        add_header X-Frame-Options           "DENY"         always;
        add_header X-Content-Type-Options    "nosniff"      always;
        add_header Referrer-Policy           "strict-origin" always;
        add_header Content-Security-Policy
          "default-src 'self'; "
          "script-src 'self' 'nonce-$request_id'; "
          "style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; "
          "font-src 'self' https://fonts.gstatic.com; "
          "img-src 'self' data: blob:; "
          "connect-src 'self' wss://api.attendance.university.edu https://api.attendance.university.edu; "
          "frame-ancestors 'none';" always;

        # ── Hashed static assets (JS/CSS) — long cache ───────────────────────
        location ~* \.(js|css|woff2?|ttf|otf|eot|ico|png|jpg|svg)$ {
            expires     1y;
            add_header  Cache-Control "public, immutable";
            access_log  off;
        }

        # ── React SPA fallback — all routes serve index.html ──────────────────
        location / {
            try_files   $uri $uri/ /index.html;
            add_header  Cache-Control "no-cache, no-store, must-revalidate";
        }
    }
}
