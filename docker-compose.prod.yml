# docker-compose.prod.yml
#
# Production Docker Compose configuration.
#
# Key differences from docker-compose.yml (dev):
#   • No volume mounts of source code (immutable containers)
#   • Resource limits on all services (prevents one container starving others)
#   • Secrets come from environment or Docker Secrets (not baked into image)
#   • Nginx terminates SSL and proxies to all services
#   • No ports exposed except Nginx 80/443 (services are internal only)
#   • Restart policies: always (except for intentional stops)
#   • Explicit health checks with tight thresholds
#
# Usage:
#   docker-compose -f docker-compose.prod.yml up -d
#   docker-compose -f docker-compose.prod.yml ps
#   docker-compose -f docker-compose.prod.yml logs -f backend

version: "3.9"

networks:
  internal:
    driver: bridge
    internal: true       # no external internet access for backend services
  public:
    driver: bridge       # only nginx connects here

volumes:
  nginx-certs:           # SSL certificates (mounted from host or cert-manager)

services:

  # ── Nginx reverse proxy ────────────────────────────────────────────────────
  nginx:
    image: nginx:1.25-alpine
    container_name: attendance-nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - nginx-certs:/etc/nginx/certs:ro
      - ./frontend/dist:/var/www/html:ro      # built frontend static files
    networks:
      - public
      - internal
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "nginx", "-t"]
      interval: 30s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 128M

  # ── Node.js API ────────────────────────────────────────────────────────────
  backend:
    image: ${ECR_REGISTRY}/attendance-backend:${IMAGE_TAG:-latest}
    container_name: attendance-backend
    restart: always
    expose:
      - "3000"
    environment:
      NODE_ENV:            production
      PORT:                3000
      MONGO_URI:           ${MONGO_URI}
      REDIS_URL:           ${REDIS_URL}
      JWT_ACCESS_SECRET:   ${JWT_ACCESS_SECRET}
      JWT_REFRESH_SECRET:  ${JWT_REFRESH_SECRET}
      JWT_ACCESS_TTL:      15m
      JWT_REFRESH_TTL:     7d
      AI_SERVICE_URL:      http://ai-service:8000
      FRONTEND_URL:        https://attendance.university.edu
      ALLOWED_ORIGINS:     https://attendance.university.edu
      QR_TOKEN_TTL_SECS:   45
      QR_LOCATION_RADIUS:  100
      MIN_ATTENDANCE_PCT:  75
      BCRYPT_ROUNDS:       12
      SMTP_HOST:           ${SMTP_HOST}
      SMTP_PORT:           ${SMTP_PORT:-587}
      SMTP_USER:           ${SMTP_USER}
      SMTP_PASS:           ${SMTP_PASS}
      FROM_EMAIL:          ${FROM_EMAIL}
      TWILIO_ACCOUNT_SID:  ${TWILIO_ACCOUNT_SID:-}
      TWILIO_AUTH_TOKEN:   ${TWILIO_AUTH_TOKEN:-}
      TWILIO_FROM_NUMBER:  ${TWILIO_FROM_NUMBER:-}
      AWS_REGION:          ${AWS_REGION:-us-east-1}
      AWS_BUCKET_NAME:     ${AWS_BUCKET_NAME}
    networks:
      - internal
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/health"]
      interval: 20s
      timeout: 8s
      start_period: 30s
      retries: 3
    deploy:
      replicas: 2          # 2 instances for HA behind Nginx least_conn
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
        reservations:
          cpus: "0.25"
          memory: 256M
    logging:
      driver: awslogs
      options:
        awslogs-group:  /attendance/backend
        awslogs-region: ${AWS_REGION:-us-east-1}
        awslogs-stream-prefix: api

  # ── Python AI microservice ─────────────────────────────────────────────────
  ai-service:
    image: ${ECR_REGISTRY}/attendance-ai:${IMAGE_TAG:-latest}
    container_name: attendance-ai
    restart: always
    expose:
      - "8000"
    environment:
      APP_ENV:                production
      PORT:                   8000
      LOG_LEVEL:              info
      MONGO_URI:              ${MONGO_URI}
      AWS_REGION:             ${AWS_REGION:-us-east-1}
      AWS_BUCKET_NAME:        ${AWS_BUCKET_NAME}
      FACE_DISTANCE_THRESHOLD: 0.50
      FACE_MIN_CONFIDENCE:     0.80
      RISK_MODEL_PATH:         /app/models/risk_model.joblib
      MIN_ATTENDANCE_PCT:      75.0
    networks:
      - internal
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      start_period: 45s    # dlib model loading takes ~10s on first start
      retries: 3
    deploy:
      resources:
        limits:
          cpus: "2.0"      # face_recognition is CPU-intensive
          memory: 1G
        reservations:
          cpus: "0.50"
          memory: 512M
    logging:
      driver: awslogs
      options:
        awslogs-group:  /attendance/ai-service
        awslogs-region: ${AWS_REGION:-us-east-1}
        awslogs-stream-prefix: ai

  # ── Certbot (Let's Encrypt SSL renewal) ────────────────────────────────────
  certbot:
    image: certbot/certbot:latest
    container_name: attendance-certbot
    volumes:
      - nginx-certs:/etc/letsencrypt
      - ./nginx/webroot:/var/www/certbot   # ACME challenge files
    entrypoint: >
      /bin/sh -c "trap exit TERM;
      while :; do
        certbot renew --webroot -w /var/www/certbot --quiet;
        sleep 12h & wait $${!};
      done;"
    networks:
      - public
    deploy:
      resources:
        limits:
          cpus: "0.10"
          memory: 64M
