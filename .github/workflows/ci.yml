# .github/workflows/ci.yml
#
# Continuous Integration — runs on every push and every PR targeting main.
#
# Job graph (parallel where possible, then sequential gates):
#
#   test-backend ──┐
#   test-ai ───────┤──▶ security ──▶ build-images ──▶ push-ecr (main only)
#   lint ──────────┘
#
# Design decisions:
#   • Each test job runs in its own container — no shared state, fully isolated.
#   • Docker layer caching uses GitHub Actions cache (not ECR) to avoid auth
#     complexity on PRs from forks.
#   • AWS credentials use OIDC (no long-lived keys stored as secrets).
#   • ECR push only happens on the main branch — PRs only build, never push.
#   • Coverage reports uploaded to Codecov for PR decoration.

name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  NODE_VERSION: "20"
  PYTHON_VERSION: "3.11"
  AWS_REGION: us-east-1
  ECR_REGISTRY: ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.us-east-1.amazonaws.com

# Cancel in-flight runs for the same branch on new push
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Backend tests ────────────────────────────────────────────────────────────
  test-backend:
    name: "Backend Tests (Node ${{ matrix.node }})"
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: ["18", "20"]   # test on both LTS versions

    services:
      mongodb:
        image: mongo:7.0
        ports: ["27017:27017"]
        options: >-
          --health-cmd "mongosh --eval 'db.adminCommand(\"ping\")'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7.2-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 3s
          --health-retries 5

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js ${{ matrix.node }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm run test:unit
        env:
          NODE_ENV: test
          MONGO_URI: mongodb://localhost:27017/attendance_test
          REDIS_URL: redis://localhost:6379
          JWT_ACCESS_SECRET: test-access-secret-at-least-32-chars-long
          JWT_REFRESH_SECRET: test-refresh-secret-at-least-32-chars-long
          AI_SERVICE_URL: http://localhost:8000

      - name: Run integration tests
        run: npm run test:integration -- --runInBand
        env:
          NODE_ENV: test
          MONGO_URI: mongodb://localhost:27017/attendance_test
          REDIS_URL: redis://localhost:6379
          JWT_ACCESS_SECRET: test-access-secret-at-least-32-chars-long
          JWT_REFRESH_SECRET: test-refresh-secret-at-least-32-chars-long

      - name: Upload coverage
        if: matrix.node == '20'
        uses: codecov/codecov-action@v3
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          directory: backend/coverage
          flags: backend

  # ── AI service tests ─────────────────────────────────────────────────────────
  test-ai:
    name: "AI Service Tests (Python ${{ env.PYTHON_VERSION }})"
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ai-service

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: ai-service/requirements.txt

      - name: Install system deps for dlib
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            cmake g++ libopenblas-dev liblapack-dev

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Generate training data & train model
        run: |
          python training/generate_sample_data.py --samples 5000 --out data/training.csv
          python training/train_risk_model.py --data data/training.csv \
            --model-out models/risk_model.joblib
        env:
          RISK_MODEL_PATH: models/risk_model.joblib
          AWS_BUCKET_NAME: test-bucket
          MONGO_URI: mongodb://localhost:27017/test

      - name: Run pytest with coverage
        run: |
          pip install pytest-cov
          pytest tests/ -v --tb=short \
            --cov=. --cov-report=xml --cov-report=term-missing
        env:
          RISK_MODEL_PATH: models/risk_model.joblib
          AWS_BUCKET_NAME: test-bucket
          MONGO_URI: mongodb://localhost:27017/test
          AWS_REGION: us-east-1

      - name: Upload coverage
        uses: codecov/codecov-action@v3
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ai-service/coverage.xml
          flags: ai-service

  # ── Linting ──────────────────────────────────────────────────────────────────
  lint:
    name: "Lint & Format Check"
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install backend deps
        working-directory: backend
        run: npm ci

      - name: ESLint — backend
        working-directory: backend
        run: npx eslint src --ext .js --max-warnings 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Black — AI service
        run: |
          pip install black==24.1.1 ruff==0.1.15 -q
          black --check ai-service/
          ruff check ai-service/

  # ── Security scanning ─────────────────────────────────────────────────────────
  security:
    name: "Security Scan"
    runs-on: ubuntu-latest
    needs: [test-backend, test-ai, lint]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: npm audit (backend)
        working-directory: backend
        run: npm audit --audit-level=high

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Bandit — Python security scan
        run: |
          pip install bandit -q
          bandit -r ai-service/ -ll -x ai-service/tests/

      - name: Trivy — Docker image vulnerability scan (frontend)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: .
          severity: CRITICAL,HIGH
          exit-code: 1
          ignore-unfixed: true

  # ── Build Docker images ───────────────────────────────────────────────────────
  build-images:
    name: "Build Docker Images"
    runs-on: ubuntu-latest
    needs: [security]

    outputs:
      backend-tag: ${{ steps.meta-backend.outputs.tags }}
      ai-tag:      ${{ steps.meta-ai.outputs.tags }}
      sha-short:   ${{ steps.sha.outputs.short }}

    steps:
      - uses: actions/checkout@v4

      - name: Get short SHA
        id: sha
        run: echo "short=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # ── Authenticate to ECR (only on main branch, using OIDC) ──────────────
      - name: Configure AWS credentials
        if: github.ref == 'refs/heads/main'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume:   arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/github-actions-ecr
          aws-region:       ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        if: github.ref == 'refs/heads/main'
        uses: aws-actions/amazon-ecr-login@v2

      # ── Backend image ────────────────────────────────────────────────────────
      - name: Extract metadata — backend
        id: meta-backend
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.ECR_REGISTRY }}/attendance-backend
          tags: |
            type=sha,prefix=sha-
            type=ref,event=branch
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build backend image
        uses: docker/build-push-action@v5
        with:
          context:   backend
          target:    runtime
          push:      ${{ github.ref == 'refs/heads/main' }}
          tags:      ${{ steps.meta-backend.outputs.tags }}
          labels:    ${{ steps.meta-backend.outputs.labels }}
          cache-from: type=gha,scope=backend
          cache-to:   type=gha,mode=max,scope=backend
          build-args: |
            BUILD_SHA=${{ steps.sha.outputs.short }}

      # ── AI service image ─────────────────────────────────────────────────────
      - name: Extract metadata — ai-service
        id: meta-ai
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.ECR_REGISTRY }}/attendance-ai
          tags: |
            type=sha,prefix=sha-
            type=ref,event=branch
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build AI service image
        uses: docker/build-push-action@v5
        with:
          context:   ai-service
          push:      ${{ github.ref == 'refs/heads/main' }}
          tags:      ${{ steps.meta-ai.outputs.tags }}
          labels:    ${{ steps.meta-ai.outputs.labels }}
          cache-from: type=gha,scope=ai-service
          cache-to:   type=gha,mode=max,scope=ai-service

      # ── Frontend build ──────────────────────────────────────────────────────
      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build
        env:
          VITE_API_URL:  https://api.attendance.university.edu/api
          VITE_WS_URL:   wss://api.attendance.university.edu

      - name: Upload frontend dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist-${{ steps.sha.outputs.short }}
          path: frontend/dist/
          retention-days: 7
